<!DOCTYPE html>
<html>
  <head>
    <title>Real Estate Chatbot</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        background-color: #f0f0f0;
      }

      .split {
        height: 50%;
        width: 100%;
      }

      .top-half {
        position: relative;
        overflow: hidden;
      }

      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .overlay h2 {
        color: white;
        font-size: 36px;
        margin-bottom: 20px;
        text-shadow: 1px 1px 2px #000;
      }

      .overlay select,
      .overlay button {
        padding: 12px;
        margin: 10px 0;
        width: 300px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        outline: none;
      }

      .overlay button {
        background-color: #0077cc;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .overlay button:hover {
        background-color: #005fa3;
      }

      .bottom-half {
        background-color: #1e1e1e;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 10px 20px;
        height: 50%;
        overflow: hidden;
        box-sizing: border-box;
      }

      #chatbox {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        background-color: #2b2b2b;
        border-radius: 10px;
        margin-bottom: 10px;
        border: 1px solid #444;
      }

      .message {
        margin: 10px 0;
        font-size: 16px;
        line-height: 1.5;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        animation: fadeIn 0.3s ease-in;
      }

      .bot {
        color: #ffffff;
        justify-content: flex-start;
        flex-direction: row;
      }

      .user {
        color: #ffffff;
        text-align: right;
        justify-content: flex-end;
        flex-direction: row-reverse;
      }

      .bot span,
      .user span {
        padding: 10px 14px;
        border-radius: 16px;
        max-width: 70%;
        display: inline-block;
        word-wrap: break-word;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
      }

      .bot span {
        background-color: #0077cc;
      }

      .user span {
        background-color: #444;
      }

      .message .icon {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.7));
      }

      #chat-input {
        display: flex;
        gap: 10px;
      }

      #input {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        outline: none;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
        background-color: #0077cc;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background-color: #005fa3;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="split top-half">
      <video autoplay muted loop>
        <source
          src="{{ url_for('static', filename='final.mp4') }}"
          type="video/mp4"
        />
        Your browser does not support the video tag.
      </video>
      <div class="overlay">
        <h2>🏠 Real Estate Chatbot</h2>
        <select id="buyerSelect">
          <option value="">Select your identity</option>
          {% for b in buyer_options %}
          <option value='{{ {"name": b.name, "phone": b.phone} | tojson }}'>
            {{ b.name }} ({{ b.phone }})
          </option>
          {% endfor %}
        </select>
        <button onclick="startChat()">Start Chat</button>
      </div>
    </div>

    <div class="split bottom-half">
      <div id="chatbox"></div>
      <div id="chat-input">
        <input
          type="text"
          id="input"
          placeholder="Type your reply..."
          onkeypress="if(event.key==='Enter'){sendMessage()}"
        />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const botIcon = `
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#a3d1ff">
          <circle cx="12" cy="12" r="10" stroke="#0077cc" stroke-width="2" fill="#0a3a66"/>
          <circle cx="8" cy="10" r="1.5" fill="#a3d1ff"/>
          <circle cx="16" cy="10" r="1.5" fill="#a3d1ff"/>
          <rect x="8" y="14" width="8" height="2" rx="1" fill="#a3d1ff"/>
        </svg>`;

      const userIcon = `
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#e3e3e3">
          <circle cx="12" cy="7" r="4" />
          <path d="M6 20c0-3.3 5-3.3 6-3.3s6 0 6 3.3v1H6v-1z" fill="#e3e3e3"/>
        </svg>`;

      let buyerId = "";
      let messages = [];

      function startChat() {
        const raw = document.getElementById("buyerSelect").value;
        if (!raw) return alert("Please select a buyer first.");
        buyerId = JSON.parse(raw);
        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ buyer_id: buyerId, message: "Hi" }),
        })
          .then((res) => res.json())
          .then((data) => {
            messages = data.messages;
            const botMessage = document.createElement("div");
            botMessage.className = "bot message";
            botMessage.innerHTML = `${botIcon}<span>${data.reply}</span>`;
            document.getElementById("chatbox").appendChild(botMessage);
            scrollToBottom();
          });
      }

      function sendMessage() {
        const input = document.getElementById("input");
        const userMessage = input.value;
        if (!userMessage) return;

        const userMessageElem = document.createElement("div");
        userMessageElem.className = "user message";
        userMessageElem.innerHTML = `${userIcon}<span>${userMessage}</span>`;
        document.getElementById("chatbox").appendChild(userMessageElem);
        input.value = "";

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            buyer_id: buyerId,
            message: userMessage,
            messages: messages,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            messages = data.messages;
            const botMessage = document.createElement("div");
            botMessage.className = "bot message";
            botMessage.innerHTML = `${botIcon}<span>${data.reply}</span>`;
            document.getElementById("chatbox").appendChild(botMessage);
            scrollToBottom();
          });
      }

      function scrollToBottom() {
        const chatbox = document.getElementById("chatbox");
        chatbox.scrollTop = chatbox.scrollHeight;
      }
    </script>
  </body>
</html>
